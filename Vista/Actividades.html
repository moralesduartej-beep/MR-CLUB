<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>CLUB ACERIAS - Registro de Actividades</title>
    <style>
        .header-mr {
            background-color: #c48bf5;
            padding: 15px 30px;
            color: white;
        }
    </style>
</head>
<body class="bg-light">

    <!-- Encabezado corregido: apunta correctamente a dashboard.html -->
    <div class="header-mr d-flex justify-content-between align-items-center">
        <h3>CLUB ACERIAS - Registro de Actividades</h3>
        <a href="dashboaard.html" class="btn btn-danger btn-sm">
            <i class="bi bi-box-arrow-right"></i> Volver al Panel
        </a>
    </div>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow p-4 border-top border-primary border-4">
                    <h4 class="text-primary mb-4"><i class="bi bi-calendar-check"></i> Registrar Nueva Actividad</h4>
                    
                    <form>
                        <div class="mb-3">
                            <label for="nombreActividad" class="form-label">Nombre de la Actividad</label>
                            <input type="text" class="form-control" id="nombreActividad" required placeholder="Ej. Evento benéfico">
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="fechaEvento" class="form-label">Fecha del Evento</label>
                                <input type="date" class="form-control" id="fechaEvento" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="lugar" class="form-label">Lugar / Municipio</label>
                                <input type="text" class="form-control" id="lugar" required placeholder="Ej. Paipa, Sogamoso">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="totalRecaudado" class="form-label">Total Recaudado ($)</label>
                            <input type="number" class="form-control" id="totalRecaudado" required placeholder="Monto total del evento">
                        </div>

                        <div class="d-flex justify-content-end gap-2 mt-4">
                            <button type="reset" class="btn btn-secondary">Limpiar</button>
                            <button type="submit" class="btn btn-primary">Guardar Actividad</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
