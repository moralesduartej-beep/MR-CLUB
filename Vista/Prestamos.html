<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>CLUB ACERIAS - Gestión de Préstamos</title>
    <style>
        .header-mr {
            background-color: #c48bf5;
            padding: 15px 30px;
            color: white;
        }
    </style>
</head>
<body class="bg-light">

    <div class="header-mr d-flex justify-content-between align-items-center">
        <h3>CLUB ACERIAS - Gestión de Préstamos</h3>
        <a href="dashboaard.html" class="btn btn-danger btn-sm">
            <i class="bi bi-box-arrow-right"></i> Volver al Panel
        </a>
    </div>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow p-4 border-top border-primary border-4">
                    <h4 class="text-primary mb-4"><i class="bi bi-file-earmark-text"></i> Registrar Nuevo Préstamo</h4>
                    
                    <form>
                        <div class="mb-3">
                            <label for="documentoAsociado" class="form-label">Documento del Asociado</label>
                            <input type="text" class="form-control" id="documentoAsociado" required placeholder="Cédula del asociado">
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="valorPrestamo" class="form-label">Valor del Préstamo ($)</label>
                                <input type="number" class="form-control" id="valorPrestamo" required placeholder="Máximo 80 millones">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="tasaInteres" class="form-label">Tasa de Interés (%)</label>
                                <input type="number" step="0.01" class="form-control" id="tasaInteres" required placeholder="Ej. 1.5">
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="numeroCuotas" class="form-label">Número de Cuotas</label>
                                <input type="number" class="form-control" id="numeroCuotas" required placeholder="Ej. 12">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="fechaPrestamo" class="form-label">Fecha del Préstamo</label>
                                <input type="date" class="form-control" id="fechaPrestamo" required>
                            </div>
                        </div>

                        <div class="d-flex justify-content-end gap-2 mt-4">
                            <button type="reset" class="btn btn-secondary">Limpiar</button>
                            <button type="submit" class="btn btn-primary">Guardar Préstamo</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
