<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registro de Préstamos - Club Acerías</title>

    <link rel="stylesheet" href="../Assets/EstiloFormulario.css">
</head>

<body>

    <div class="Contenedor-Formulario">

        <h2>Registro de Prestamos</h2>

        <form id="FormularioPrestamo">

            <div class="grupo-input">
                <label for="Asociado">Seleccionar asociado:</label>
                <select id="Asociado" required>
                    <option value="">Seleccione un asociado</option>
                </select>
            </div>

            <div class="grupo-input">
                <label for="ValorPrestamo">Valor del préstamo:</label>
                <input type="number" id="ValorPrestamo"
                    min="1" max="80000000" required
                    placeholder="Ejemplo: 5000000">
            </div>

            <div class="grupo-input">
                <label for="FechaPrestamo">Fecha del préstamo:</label>
                <input type="date" id="FechaPrestamo" required>
            </div>

            <div class="grupo-input">
                <label for="Interes">Interés mensual (%):</label>
                <input type="number" id="Interes"
                    min="0" max="100" step="0.01" required
                    placeholder="Ejemplo: 2">
            </div>

            <div class="grupo-input">
                <label for="Cuotas">Número de cuotas:</label>
                <input type="number" id="Cuotas"
                    min="1" required
                    placeholder="Ejemplo: 12">
            </div>

            <div class="grupo-input">
                <label for="Observaciones">Observaciones:</label>
                <textarea id="Observaciones" rows="3"
                    placeholder="Información adicional del préstamo"></textarea>
            </div>

            <div class="grupo-botones">
                <button type="submit">Guardar préstamo</button>
                <button type="reset">Limpiar</button>
            </div>

        </form>

        <p id="mensajePrestamo"></p>

        <hr>

        <h2>Prestamos registrados</h2>

        <div class="tabla-contenedor">
            <table>
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Asociado</th>
                        <th>Valor</th>
                        <th>Fecha</th>
                        <th>Cuotas</th>
                        <th>Saldo pendiente</th>
                        <th>Estado</th>
                    </tr>
                </thead>

                <tbody id="tablaPrestamos"></tbody>
            </table>
        </div>

        <div class="grupo-botones">
            <button type="button"
                onclick="window.location.href='dashboaard.html'">
                Volver al panel
            </button>
        </div>

    </div>

    <script src="../Controlador/Prestamos.js"></script>

</body>
</html>
