<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Asociados - CLUB ACERIAS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/CSS/EstilosTarjetas.css">
</head>
<body>

    <header class="header-bar">
        <h1>CLUB ACERIAS - Gestión de Asociados</h1>
        <div class="header-user">
            <span>Admin MR</span>
            <a href="dashboaard.html" class="btn-cerrar-sesion">
                <i class="fa-solid fa-right-from-bracket"></i> Volver al Panel
            </a>
        </div>
    </header>

    <main class="container">
        <!-- Formulario de Registro/Edición -->
        <div class="card-panel">
            <h2><i class="fa-solid fa-user-plus"></i> Registrar Nuevo Asociado</h2>
            
            <!-- Mensaje de confirmación o error -->
            <div id="MensajeRegistro" style="margin-top: 10px; font-weight: bold; text-align: center;"></div>

            <form id="formAsociado" class="form-grid" style="margin-top: 15px;">
                <div class="form-group">
                    <label>Documento de Identidad</label>
                    <input type="text" name="Documento" placeholder="Ej. 1049123456" required>
                </div>

                <div class="form-group">
                    <label>Nombres</label>
                    <input type="text" name="Nombres" placeholder="Nombres" required>
                </div>

                <div class="form-group">
                    <label>Apellidos</label>
                    <input type="text" name="Apellidos" placeholder="Apellidos" required>
                </div>

                <div class="form-group">
                    <label>Fecha de Nacimiento</label>
                    <input type="date" name="FechaNacimiento" required>
                </div>

                <div class="form-group">
                    <label>Dirección de Residencia</label>
                    <input type="text" name="direccionResidencia" placeholder="Ej. Calle 12 # 4-56" required>
                </div>

                <div class="form-group">
                    <label>Ciudad</label>
                    <select name="Ciudad" required>
                        <option value="" disabled selected>Seleccionar...</option>
                        <option value="Sogamoso">Sogamoso</option>
                        <option value="Duitama">Duitama</option>
                        <option value="Tunja">Tunja</option>
                        <option value="Otra">Otra</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Teléfono</label>
                    <input type="tel" name="Telefono" placeholder="300 000 0000" required>
                </div>

                <div class="form-group">
                    <label>Correo Electrónico</label>
                    <input type="email" name="Email" placeholder="correo@ejemplo.com" required>
                </div>

                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" name="Contraseña" placeholder="Contraseña" required>
                </div>

                <div class="form-group">
                    <label>Confirmar Contraseña</label>
                    <input type="password" name="ConfirmarContraseña" placeholder="Confirmar contraseña" required>
                </div>

                <div class="form-group">
                    <label>Género</label>
                    <select name="Genero" required>
                        <option value="" disabled selected>Seleccionar...</option>
                        <option value="FEMENINO">Femenino</option>
                        <option value="MASCULINO">Masculino</option>
                        <option value="OTRO">Otro</option>
                    </select>
                </div>

                <div class="form-group" style="grid-column: 1 / -1; display: flex; gap: 10px;">
                    <button type="submit" class="btn-primary" style="width: max-content;">Guardar Asociado</button>
                    <button type="reset" class="btn-secondary" style="width: max-content;">Limpiar Formulario</button>
                </div>
            </form>
        </div>

        <!-- Listado de Asociados -->
        <div class="card-panel">
            <h2><i class="fa-solid fa-users"></i> Listado de Asociados</h2>
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Documento</th>
                        <th>Nombre</th>
                        <th>Teléfono</th>
                        <th>Ciudad</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>1049888777</td>
                        <td>Carlos Mendoza</td>
                        <td>311 234 5678</td>
                        <td>Duitama</td>
                        <td><span class="badge badge-success">Activo</span></td>
                        <td><button class="btn-primary" style="padding: 4px 8px; font-size: 0.8rem;">Editar</button></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <!-- Ruta corregida a Controller/Asociados.js -->
    <script src="../Controller/Asociados.js"></script>
</body>
</html>
