<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <title>Registro de Asociados - CLUB ACERIAS</title>
    <style>
        .header-mr {
            background-color: rgb(111, 163, 231);
            padding: 15px 30px;
            color: white;
        }
    </style>
</head>
<body class="bg-light">

    <!-- Encabezado superior -->
    <div class="header-mr d-flex justify-content-between align-items-center mb-4">
        <h3 class="mb-0">CLUB ACERIAS - Registro de Asociado</h3>
        <a href="dashboaard.html" class="btn btn-light btn-sm text-primary fw-bold">
            <i class="bi bi-arrow-left"></i> Volver al Panel
        </a>
    </div>

    <div class="container pb-5">
        <div class="row justify-content-center">
            <div class="col-md-9">
                <div class="card shadow-sm border-top border-primary border-4 p-4">
                    <h4 class="text-primary mb-4">
                        <i class="bi bi-person-plus-fill me-2"></i>Formulario de Registro de Asociado
                    </h4>

                    <form id="formAsociados">
                        <div class="row g-3">
                            <!-- Documento -->
                            <div class="col-md-6">
                                <label for="documento" class="form-label font-weight-bold">Ingresar Documento</label>
                                <input type="text" class="form-control" id="documento" placeholder="Ej. 1054869578" required>
                            </div>

                            <!-- Nombres -->
                            <div class="col-md-6">
                                <label for="nombres" class="form-label">Ingresar Nombres</label>
                                <input type="text" class="form-control" id="nombres" placeholder="Ingrese nombre completo" required>
                            </div>

                            <!-- Apellidos -->
                            <div class="col-md-6">
                                <label for="apellidos" class="form-label">Ingresar Apellidos</label>
                                <input type="text" class="form-control" id="apellidos" placeholder="Ingrese apellidos completos" required>
                            </div>

                            <!-- Fecha de Nacimiento -->
                            <div class="col-md-6">
                                <label for="fechaNacimiento" class="form-label">Fecha de Nacimiento</label>
                                <input type="date" class="form-control" id="fechaNacimiento" required>
                            </div>

                            <!-- Dirección -->
                            <div class="col-md-6">
                                <label for="direccion" class="form-label">Dirección de Residencia</label>
                                <input type="text" class="form-control" id="direccion" placeholder="Ej. Calle 12 # 6-49" required>
                            </div>

                            <!-- Ciudad -->
                            <div class="col-md-6">
                                <label for="ciudad" class="form-label">Ciudad</label>
                                <select class="form-select" id="ciudad" required>
                                    <option value="" disabled selected>Seleccionar ciudad...</option>
                                    <option value="Sogamoso">Sogamoso</option>
                                    <option value="Duitama">Duitama</option>
                                    <option value="Tunja">Tunja</option>
                                    <option value="Otra">Otra</option>
                                </select>
                            </div>

                            <!-- Teléfono -->
                            <div class="col-md-6">
                                <label for="telefono" class="form-label">Teléfono</label>
                                <input type="tel" class="form-control" id="telefono" placeholder="Ej. 3125847896" required>
                            </div>

                            <!-- Email -->
                            <div class="col-md-6">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" placeholder="Ej. valeria@gmail.com" required>
                            </div>

                            <!-- Contraseña -->
                            <div class="col-md-6">
                                <label for="password" class="form-label">Contraseña</label>
                                <input type="password" class="form-control" id="password" placeholder="Mínimo 8 caracteres" required>
                            </div>

                            <!-- Género -->
                            <div class="col-md-6">
                                <label class="form-label d-block">Género</label>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="genero" id="generoF" value="FEMENINO" required>
                                    <label class="form-check-label" for="generoF">Femenino</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="genero" id="generoM" value="MASCULINO">
                                    <label class="form-check-label" for="generoM">Masculino</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="genero" id="generoO" value="OTRO">
                                    <label class="form-check-label" for="generoO">Otro</label>
                                </div>
                            </div>

                            <!-- Botones -->
                            <div class="col-12 text-end mt-4">
                                <button type="reset" class="btn btn-secondary me-2">Limpiar Formulario</button>
                                <button type="submit" class="btn btn-primary">Guardar Asociado</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Script del Controlador JS -->
    <script src="../Controller/Asociados.js"></script>
</body>
</html>
